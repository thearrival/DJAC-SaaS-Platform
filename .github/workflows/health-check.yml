name: Health Monitor

# Synthetic uptime/health probe for the production platform.
#
# Runs every 30 minutes (plus on demand): checks the public health endpoints and
# the login page, asserts `ok: true`, and opens a GitHub issue when a probe
# fails so the team is alerted. Stays quiet while healthy.

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  probe:
    name: Probe production
    runs-on: ubuntu-latest
    steps:
      - name: Probe /api/status, /api/readyz, /login
        id: probe
        run: |
          set -uo pipefail
          BASE="https://app.yalla-hack.ae"
          fail=0
          for path in /api/status /api/readyz /login; do
            code=$(curl -s -o "/tmp/body" -w "%{http_code}" -m 30 "$BASE$path" || echo "000")
            echo "$path -> $code"
            if [ "$code" != "200" ]; then
              echo "::error::$path returned $code"
              fail=1
            fi
          done
          status_body=$(curl -s -m 30 "$BASE/api/status" || true)
          echo "status: $status_body"
          echo "$status_body" | grep -q '"ok":true' || { echo "::error::/api/status did not report ok:true"; fail=1; }
          ready_body=$(curl -s -m 30 "$BASE/api/readyz" || true)
          echo "$ready_body" | grep -q '"ok":true' || { echo "::error::/api/readyz did not report ok:true"; fail=1; }
          exit "$fail"

      - name: Open alert issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "🚨 Production health check failed";
            const body = [
              "The scheduled health probe failed.",
              "",
              `- Time (UTC): ${new Date().toISOString()}`,
              `- Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              "",
              "Investigate: `curl -s https://app.yalla-hack.ae/api/status` and `/api/readyz`.",
            ].join("\n");
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "health-alert",
            });
            if (open.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ["health-alert"],
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: open.data[0].number,
                body,
              });
            }

      - name: Close alert issue when healthy
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "health-alert",
            });
            for (const issue of open.data) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `Recovered — health probe passing again at ${new Date().toISOString()}.`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: "closed",
              });
            }
