name: Force Deploy Docs

on:
  workflow_dispatch:

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "10.4.1"
  VERCEL_ORG_ID: "team_xS2mdeBXinbhSUdgWu1eKUEF"
  VERCEL_PROJECT_ID: "prj_nzZ267pel57FCf9DBz4V9gUy7IWe"

jobs:
  deploy-prod:
    name: Force Deploy to Production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Verify Build
        run: pnpm lint && pnpm check && pnpm test && pnpm build

      - name: Install Vercel CLI
        run: pnpm add -g vercel@latest

      - name: Deploy to Vercel
        run: |
          vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
          vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
          DEPLOY_URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "deploy_url=$DEPLOY_URL" >> $GITHUB_OUTPUT
          echo "DEPLOYED TO: $DEPLOY_URL"

      - name: Health Check
        run: |
          sleep 15
          curl -sfL "https://app.yalla-hack.ae/api/health" || echo "Health check via main domain"
          curl -sfL "https://app.yalla-hack.ae/docs/getting-started/welcome" || echo "Docs check via main domain"
