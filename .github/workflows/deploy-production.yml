name: Deploy Production

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "10.4.1"
  VERCEL_ORG_ID: "team_xS2mdeBXinbhSUdgWu1eKUEF"
  VERCEL_PROJECT_ID: "prj_nzZ267pel57FCf9DBz4V9gUy7IWe"

jobs:
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile

      - name: Generate Vercel handler bundle
        run: node scripts/prebuild-vercel.mjs

      - name: CI Checks
        run: pnpm lint && pnpm check && pnpm test

      - name: Install Vercel CLI
        run: pnpm add -g vercel@latest

      - name: Pull Vercel Environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Production
        id: deploy
        run: |
          DEPLOY_URL=$(vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "deploy_url=$DEPLOY_URL" >> $GITHUB_OUTPUT
          echo "Deployed to: $DEPLOY_URL"

      - name: Health Check
        run: |
          sleep 15
          STATUS=$(curl -sf "https://app.yalla-hack.ae/api/status") || exit 1
          echo "$STATUS" | jq -e '.ok == true and .dbConnected == true and .env == "production"' >/dev/null || {
            echo "API not fully healthy: $STATUS"
            exit 1
          }
          echo "API healthy, DB connected: $STATUS"
