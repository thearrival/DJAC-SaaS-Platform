name: E2E (Playwright)

# Manual / scheduled end-to-end run. Not part of the default CI gate because it
# requires a live environment and a dedicated test account.
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Base URL to test
        required: true
        default: https://app.yalla-hack.ae

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright
        run: |
          pnpm add -D @playwright/test
          npx playwright install --with-deps chromium
      - name: Run E2E
        env:
          E2E_BASE_URL: ${{ inputs.base_url }}
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
        run: npx playwright test
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
